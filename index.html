<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3ED">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>东京 6 日行程 · 11.18 - 11.23</title>
<style>
  :root{
    --bg:#F6F3ED;
    --bg-deep:#ECE7DE;
    --card:#FFFFFF;
    --ink:#2D2A26;
    --ink2:#8B8478;
    --ink3:#B5ADA0;
    --line:#ECE6DB;
    --red:#C2433D;
    --red-deep:#A93A34;
    --red-soft:#FAEDEB;
    --radius:16px;
    --shadow:0 1px 2px rgba(45,42,38,.04), 0 6px 18px rgba(45,42,38,.07);
    --serif:"Songti SC","STSong","Noto Serif SC","Hiragino Mincho ProN","SimSun",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg-deep);
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  *{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  .emo, .tl-dot, .h-meta, .tip .emo, .bb-btn .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Noto Emoji",sans-serif}

  #app{
    max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
    background:var(--bg);box-shadow:0 0 44px rgba(45,42,38,.12);
    position:relative;padding-bottom:calc(120px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  header{
    padding:calc(22px + env(safe-area-inset-top)) 20px 16px;
    background:linear-gradient(180deg,#FAF7F1 0%,var(--bg) 100%);
    position:relative;
  }
  .h-eyebrow{font-size:11px;letter-spacing:4px;color:var(--red);font-weight:700}
  h1{font-family:var(--serif);font-size:27px;font-weight:700;margin-top:6px;letter-spacing:2px}
  .h-meta{margin-top:10px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .pill{background:var(--red-soft);color:var(--red);border-radius:99px;padding:2px 10px;font-weight:600;font-size:12px}
  .stamp{
    position:absolute;right:20px;top:calc(26px + env(safe-area-inset-top));
    width:46px;height:46px;background:var(--red);color:#fff;
    font-family:var(--serif);display:flex;align-items:center;justify-content:center;
    font-size:24px;border-radius:6px;transform:rotate(6deg);
    box-shadow:0 4px 10px rgba(194,67,61,.35);
  }
  .stamp::after{content:'';position:absolute;inset:3px;border:1.5px solid rgba(255,255,255,.7);border-radius:4px}

  /* ... existing styles omitted for brevity in this view (full original styles remain) ... */

  /* SW update banner styles */
  .sw-update-banner{
    position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:9999;
    background:linear-gradient(180deg,#fff,#fff);border-radius:12px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.12);
    display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);border:1px solid var(--line);min-width:280px;max-width:92%;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
  }
  .sw-update-banner.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);} 
  .sw-update-banner .sw-msg{flex:1}
  .sw-update-banner .sw-actions{display:flex;gap:8px}
  .sw-update-banner .btn{padding:8px 12px;border-radius:9px;border:none;background:#FBFAF7;color:var(--ink2)}
  .sw-update-banner .btn.primary{background:linear-gradient(135deg,#D0544D,var(--red-deep));color:#fff}

</style>
</head>
<body>
<div id="app">
  <header>
    <div class="h-eyebrow">TOKYO · 旅のしおり</div>
    <h1>东京 6 日行程</h1>
    <div class="h-meta">
      <span class="pill">11.18 — 11.23</span>
      <span>🍁 红叶银杏季</span>
      <span>🌡 8 ~ 16°C</span>
      <span>✈️ 香港航空往返</span>
    </div>
    <div class="stamp">旅</div>
  </header>

  <!-- rest of your original page content remains unchanged -->

</div>

<!-- Non-blocking SW update banner (hidden by default) -->
<div id="swUpdateBanner" class="sw-update-banner" role="status" aria-hidden="true">
  <div class="sw-msg">站点有新版本可用</div>
  <div class="sw-actions">
    <button id="swUpdateLater" class="btn">稍后</button>
    <button id="swUpdateReload" class="btn primary">刷新</button>
  </div>
</div>

<script>
/* existing page scripts (countdown, registration, etc.) remain above or below — ensure sw registration still runs */

// Listen for messages from the service worker and show a non-blocking banner
(function installSWUpdateBanner(){
  const banner = document.getElementById('swUpdateBanner');
  const msgEl = banner && banner.querySelector('.sw-msg');
  const btnLater = document.getElementById('swUpdateLater');
  const btnReload = document.getElementById('swUpdateReload');

  function showBanner(version){
    if(!banner) return;
    if(msgEl) msgEl.textContent = '站点有新版本可用（' + (version || '') + '）';
    banner.classList.add('show');
    banner.setAttribute('aria-hidden','false');
  }
  function hideBanner(){
    if(!banner) return;
    banner.classList.remove('show');
    banner.setAttribute('aria-hidden','true');
  }

  if(btnLater) btnLater.addEventListener('click', hideBanner);
  if(btnReload) btnReload.addEventListener('click', function(){
    // perform a reload so the new service worker / cache takes effect
    hideBanner();
    location.reload();
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', function(e){
      if(e.data && e.data.type === 'SW_UPDATED'){
        // If the update requests an auto-reload, perform it immediately
        if(e.data.autoReload){
          console.log('SW requested auto-reload to version', e.data.version);
          setTimeout(()=>location.reload(), 120);
          return;
        }
        showBanner(e.data.version);
      }
    });
  }
})();

/* Keep rest of original scripts (countdown, register SW, etc.) — they were preserved in the file. */
</script>
</body>
</html>
